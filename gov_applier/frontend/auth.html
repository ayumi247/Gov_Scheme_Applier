<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Registration | Gov Scheme Applier</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="css/globals.css">
    <link rel="stylesheet" href="css/layouts.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/animations.css">

    <style>
        .auth-container {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: calc(100vh - 70px - 80px); /* viewport - navbar - footer approx */
        }
        
        .auth-card {
            width: 100%;
            max-width: 450px;
            padding: 2.5rem;
        }
        
        .auth-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        
        .auth-header h2 {
            font-size: 1.75rem;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
        }
        
        .auth-header p {
            color: var(--text-secondary);
        }
        
        .auth-toggle {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }
        
        .auth-toggle a {
            font-weight: 600;
            cursor: pointer;
        }
        /* Registration form is managed by JS toggles now */
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar">
        <div class="container">
            <a href="index.html" class="nav-brand">
                <i class="fa-solid fa-building-columns"></i>
                GovApplier
            </a>
            <div class="nav-actions">
                <button class="theme-toggle" id="themeToggleBtn" aria-label="Toggle Theme">
                    <i class="fa-solid fa-moon"></i>
                </button>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="main-content auth-container">
        
        <!-- Login Form -->
        <div class="card auth-card animate-fade-in-up" id="loginFormCard">
            <div class="auth-header">
                <h2>Welcome Back</h2>
                <p>Log in to track your applications</p>
            </div>
            
            <form id="loginForm">
                <div class="form-group">
                    <label class="form-label" for="loginEmail">Email Address</label>
                    <input type="email" id="loginEmail" class="form-control" placeholder="you@example.com" required>
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="loginPassword">Password</label>
                    <input type="password" id="loginPassword" class="form-control" placeholder="••••••••" required>
                </div>
                
                <button type="submit" class="btn btn-primary" style="width: 100%;">Log In</button>
            </form>
            
            <div class="auth-toggle">
                Don't have an account? <a id="showRegisterBtn">Sign up</a>
            </div>
        </div>
        
        <!-- Register Form -->
        <div class="card auth-card animate-fade-in-up" id="registerFormCard" style="display: none;">
            <div class="auth-header">
                <h2>Create Account</h2>
                <p>Start applying for schemes today</p>
            </div>
            
            <form id="registerForm">
                <div class="form-group">
                    <label class="form-label" for="regName">Full Name (As per Aadhar)</label>
                    <input type="text" id="regName" class="form-control" placeholder="John Doe" required>
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="regEmail">Email Address</label>
                    <input type="email" id="regEmail" class="form-control" placeholder="you@example.com" required>
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="regPassword">Password</label>
                    <input type="password" id="regPassword" class="form-control" placeholder="Create a strong password" required>
                </div>
                
                <button type="submit" class="btn btn-primary" style="width: 100%;">Create Account</button>
            </form>
            
            <div class="auth-toggle">
                Already have an account? <a id="showLoginBtn">Log in</a>
            </div>
        </div>

    </main>

    <!-- Core Scripts -->
    <script src="js/app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/auth.js"></script>
    
    <!-- UI Toggle Logic -->
    <script>
        document.getElementById('showRegisterBtn').addEventListener('click', () => {
            document.getElementById('loginFormCard').style.display = 'none';
            document.getElementById('registerFormCard').style.display = 'block';
        });
        
        document.getElementById('showLoginBtn').addEventListener('click', () => {
            document.getElementById('registerFormCard').style.display = 'none';
            document.getElementById('loginFormCard').style.display = 'block';
        });
    </script>
</body>
</html>
